[project]
name = "line-photo-bot"
version = "0.1.0"
description = "Python implementation of the LINE photo-description automation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "respx>=0.22,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "respx>=0.22,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
